    dialog{width:min(31rem,calc(100vw - 2rem));border:0;border-radius:1.1rem;background:#fff;padding:0;box-shadow:0 1.5rem 5rem #0005}dialog::backdrop{background:#191917aa;backdrop-filter:blur(3px)}.dialog-inner{position:relative;padding:1.7rem}.dialog-inner h3{margin-bottom:.6rem}.dialog-inner>p{margin-bottom:1rem;color:var(--muted);font-size:.82rem;line-height:1.5}.dialog-close{position:absolute;top:1rem;right:1rem;width:2rem;height:2rem;border:0;border-radius:50%;background:#eee}.success-icon{display:grid;width:4rem;height:4rem;place-items:center;margin:0 auto 1rem;border-radius:50%;background:var(--green);color:var(--green-ink);font-size:2rem}.success{text-align:center}.success .primary{width:100%;margin-top:.5rem}.toast{position:fixed;z-index:100;right:1rem;bottom:1rem;max-width:23rem;transform:translateY(2rem);border-radius:.75rem;background:var(--ink);color:#fff;padding:.8rem 1rem;font-size:.8rem;opacity:0;pointer-events:none;transition:.2s}.toast.show{transform:none;opacity:1}@keyframes rise{from{opacity:0;transform:translateY(-.6rem)}to{opacity:1;transform:none}}

<body>
  <header class="topbar"><div class="topbar-inner">
    <button class="location" onclick="scrollTo({top:0,behavior:'smooth'})"><small>Ваш ресторан</small><b id="headerVenue">Горького</b></button>
    <button class="brand" onclick="scrollTo({top:0,behavior:'smooth'})"><strong>Зерно</strong><small>ПАСТА-БАР</small></button>
    <div class="mode"><button id="guestMode" class="active" onclick="setMode('guest')">Гость</button><button id="adminMode" onclick="requestAdmin()">Админ</button></div>
  </div></header>
  <section class="hero"><div class="hero-copy"><span>ЗЕРНО · ОНЛАЙН-БРОНЬ <i class="demo-tag">АВТОНОМНОЕ ДЕМО</i></span><h1>ВАШ СТОЛИК<br>УЖЕ ЖДЁТ</h1></div></section>
  <main class="wrap" id="app"></main>

  <dialog id="pinDialog"><div class="dialog-inner"><button class="dialog-close" onclick="closeDialog('pinDialog')">×</button><h3>ВХОД АДМИНИСТРАТОРА</h3><p>Введите демо-PIN. В рабочей версии у каждого сотрудника будет собственный доступ.</p><form class="form" onsubmit="unlockAdmin(event)"><label class="field"><span>PIN-код</span><input name="pin" inputmode="numeric" autocomplete="off" placeholder="Введите PIN" required></label><button class="primary">Открыть управление</button><span class="form-note">Демо-PIN: 1919</span></form></div></dialog>
  <dialog id="waitDialog"><div class="dialog-inner"><button class="dialog-close" onclick="closeDialog('waitDialog')">×</button><h3>ЛИСТ ОЖИДАНИЯ</h3><p id="waitDescription"></p><form class="form" onsubmit="submitWaitlist(event)"><label class="field"><span>Ваше имя</span><input name="name" required maxlength="60" placeholder="Например, Алексей"></label><label class="field"><span>Телефон</span><input name="phone" required maxlength="24" placeholder="+7 999 123-45-67"></label><button class="primary">Добавить в лист ожидания</button></form></div></dialog>
  <dialog id="successDialog"><div class="dialog-inner success"><div class="success-icon">✓</div><h3>СТОЛИК ЗАБРОНИРОВАН</h3><p id="successText"></p><button class="primary" onclick="closeDialog('successDialog')">Готово</button></div></dialog>
  <div class="toast" id="toast"></div>

  <script>
  const venues=[
    {id:'gorkogo',short:'Горького',name:'Зерно · Горького',address:'ул. Горького, 19',hours:'11:00–22:00',phone:'+7 (4912) 52-52-19',tables:[
      {id:1,x:16,y:23,seats:2,note:'у окна'},{id:2,x:48,y:23,seats:4,note:'у окна'},{id:3,x:81,y:23,seats:2,note:'у окна'},{id:4,x:18,y:54,seats:4,note:'основной зал'},{id:5,x:79,y:54,seats:4,note:'основной зал'},{id:6,x:48,y:76,seats:6,note:'большой стол',shape:'long'},{id:7,x:82,y:79,seats:2,note:'у входа'}]},
    {id:'plaza',short:'ТРЦ Плаза',name:'Зерно · ТРЦ Плаза',address:'Первомайский просп., 70А',hours:'10:00–22:00',phone:'+7 (4912) 52-52-07',tables:[
      {id:1,x:17,y:22,seats:2,note:'у окна'},{id:2,x:44,y:22,seats:2,note:'у окна'},{id:3,x:73,y:22,seats:4,note:'у окна'},{id:4,x:18,y:52,seats:4,note:'основной зал'},{id:5,x:50,y:50,seats:4,note:'основной зал'},{id:6,x:81,y:50,seats:2,note:'тихий стол'},{id:7,x:27,y:79,seats:6,note:'два объединённых',shape:'long'},{id:8,x:74,y:79,seats:4,note:'рядом с выходом'}]},
    {id:'malina',short:'ТРЦ Малина',name:'Зерно · ТРЦ Малина',address:'ул. Соборная, 15А',hours:'10:00–22:00',phone:'+7 (4912) 52-52-34',tables:[
      {id:1,x:15,y:24,seats:2,note:'у витрины'},{id:2,x:41,y:24,seats:4,note:'у витрины'},{id:3,x:72,y:24,seats:4,note:'у витрины'},{id:4,x:18,y:57,seats:2,note:'основной зал'},{id:5,x:48,y:55,seats:6,note:'большой стол',shape:'long'},{id:6,x:79,y:56,seats:4,note:'основной зал'},{id:7,x:26,y:82,seats:4,note:'у стены'},{id:8,x:72,y:82,seats:2,note:'у входа'}]}
  ];
  const base=[];
  [1,2,3,4,5,6,7].forEach((t,i)=>base.push({id:`base-gorkogo-${t}`,venueId:'gorkogo',tableId:t,start:1140,end:i%2?1260:1230,guests:t===6?6:2,name:t===4?'Гости в зале':'Демо-бронь',phone:'Тестовая запись',comment:'',status:t===4?'occupied':'reserved'}));
  base.push(
    {id:'base-gorkogo-2-17',venueId:'gorkogo',tableId:2,start:1020,end:1110,guests:2,name:'Демо-бронь',phone:'Тестовая запись',comment:'',status:'reserved'},
    {id:'base-plaza-2',venueId:'plaza',tableId:2,start:1140,end:1230,guests:2,name:'Демо-бронь',phone:'Тестовая запись',comment:'',status:'reserved'},
    {id:'base-plaza-5',venueId:'plaza',tableId:5,start:1110,end:1200,guests:4,name:'Гости в зале',phone:'Тестовая запись',comment:'',status:'occupied'},
    {id:'base-plaza-8',venueId:'plaza',tableId:8,start:1200,end:1290,guests:4,name:'Демо-бронь',phone:'Тестовая запись',comment:'',status:'reserved'},
    {id:'base-malina-1',venueId:'malina',tableId:1,start:1110,end:1200,guests:2,name:'Демо-бронь',phone:'Тестовая запись',comment:'',status:'reserved'},
    {id:'base-malina-3',venueId:'malina',tableId:3,start:1170,end:1260,guests:4,name:'Демо-бронь',phone:'Тестовая запись',comment:'',status:'reserved'},
    {id:'base-malina-6',venueId:'malina',tableId:6,start:1080,end:1170,guests:4,name:'Гости в зале',phone:'Тестовая запись',comment:'',status:'occupied'}
  );
  const activeStatuses=['new','confirmed','late','seated','occupied','reserved'];
  const labels={new:'Новая',confirmed:'Подтверждена',late:'Опаздывают',seated:'Гости пришли',occupied:'За столом',reserved:'Бронь',completed:'Завершена',cancelled:'Отменена',no_show:'Не пришли',waitlist:'Лист ожидания'};
  const storeKey='zerno_offline_demo_v1';
  const saved=(()=>{try{return JSON.parse(localStorage.getItem(storeKey))||{}}catch{return {}}})();
  const state={venueId:'gorkogo',origin:null,start:1140,duration:90,guests:2,selected:null,mode:'guest',view:'map',bookings:Array.isArray(saved.bookings)?saved.bookings:[],overrides:saved.overrides||{}};
  const $=id=>document.getElementById(id);
  const venue=()=>venues.find(v=>v.id===state.venueId);
  const fmt=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const allBookings=()=>base.map(b=>({...b,status:state.overrides[b.id]||b.status})).concat(state.bookings);
  const overlaps=(b,start=state.start,end=state.start+state.duration)=>b.start<end&&b.end>start&&activeStatuses.includes(b.status);
  const rowsFor=(venueId,tableId)=>allBookings().filter(b=>b.venueId===venueId&&b.tableId===tableId&&overlaps(b));
  const tableState=(venueId,tableId)=>{const rows=rowsFor(venueId,tableId);return rows.some(r=>['occupied','seated'].includes(r.status))?'occupied':rows.some(r=>r.status==='late')?'late':rows.length?'reserved':'free'};
  const freeCount=(venueId=state.venueId)=>venues.find(v=>v.id===venueId).tables.filter(t=>t.seats>=state.guests&&tableState(venueId,t.id)==='free').length;
  const tableWord=n=>n%10===1&&n%100!==11?'стол':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'стола':'столов';
  function save(){localStorage.setItem(storeKey,JSON.stringify({bookings:state.bookings,overrides:state.overrides}))}
  function today(){return new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric',month:'long'}).format(new Date()).replace('.','')}
  function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2600)}
  function closeDialog(id){$(id).close()}
  function statusLabel(status){return labels[status]||status}
  function badgeClass(status){return ['occupied','seated'].includes(status)?'occupied':status==='late'?'late':activeStatuses.includes(status)?'reserved':'free'}

  function setMode(mode){state.mode=mode;state.selected=null;render();scrollTo({top:document.querySelector('.hero').offsetHeight,behavior:'smooth'})}
  function requestAdmin(){if(sessionStorage.getItem('zerno_admin')==='1')setMode('admin');else $('pinDialog').showModal()}
  function unlockAdmin(event){event.preventDefault();const pin=new FormData(event.currentTarget).get('pin');if(pin==='1919'){sessionStorage.setItem('zerno_admin','1');closeDialog('pinDialog');setMode('admin');toast('Режим администратора открыт')}else toast('Неверный PIN')}
  function setVenue(id,fromAlternative=false){if(fromAlternative&&!state.origin)state.origin=state.venueId;state.venueId=id;state.selected=null;render();scrollTo({top:document.querySelector('.hero').offsetHeight,behavior:'smooth'})}
  function returnToAlternatives(){if(state.origin){state.venueId=state.origin;state.origin=null;state.selected=null;render();scrollTo({top:document.querySelector('.hero').offsetHeight+150,behavior:'smooth'})}}
  function setStart(value){state.start=Number(value);state.selected=null;render()}
  function setDuration(value){state.duration=Number(value);state.selected=null;render()}
  function setGuests(value){state.guests=Number(value);state.selected=null;render()}
  function selectTable(id){state.selected=id;render();if(innerWidth<701)setTimeout(()=>document.querySelector('.detail.active,.admin-detail.active')?.scrollIntoView({block:'end'}),50)}
  function openWaitlist(){$('waitDescription').textContent=`${venue().name}, сегодня в ${fmt(state.start)}. Администратор увидит заявку в общем списке.`;$('waitDialog').showModal()}
  function submitWaitlist(event){event.preventDefault();const data=new FormData(event.currentTarget);state.bookings.push({id:`local-${Date.now()}`,venueId:state.venueId,tableId:null,start:state.start,end:state.start+state.duration,guests:state.guests,name:String(data.get('name')),phone:String(data.get('phone')),comment:'',status:'waitlist'});save();event.currentTarget.reset();closeDialog('waitDialog');toast('Вы добавлены в лист ожидания');render()}
  function submitBooking(event){event.preventDefault();const table=venue().tables.find(t=>t.id===state.selected);if(!table||tableState(state.venueId,table.id)!=='free'){toast('Этот стол уже недоступен');render();return}const data=new FormData(event.currentTarget);const phone=String(data.get('phone'));if(phone.replace(/\D/g,'').length<10){toast('Проверьте номер телефона');return}const name=String(data.get('name'));state.bookings.push({id:`local-${Date.now()}`,venueId:state.venueId,tableId:table.id,start:state.start,end:state.start+state.duration,guests:state.guests,name,phone,comment:String(data.get('comment')||''),status:'new'});save();$('successText').textContent=`${name}, ждём вас в ${venue().name} сегодня в ${fmt(state.start)}. Стол ${table.id}.`;$('successDialog').showModal();state.selected=null;render()}
  function changeStatus(id,status){if(id.startsWith('base-'))state.overrides[id]=status;else{const row=state.bookings.find(b=>b.id===id);if(row)row.status=status}save();toast(`Статус: ${statusLabel(status)}`);render()}
  function resetDemo(){if(!confirm('Удалить созданные тестовые брони и вернуть исходный сценарий?'))return;state.bookings=[];state.overrides={};state.selected=null;save();render();toast('Демо возвращено в исходное состояние')}

  function renderHall(admin=false){const v=venue();return `<div class="hall"><div class="hall-head"><div><b>${esc(v.name)}</b><span>${esc(v.address)}</span></div><small>ДЕМО-ПЛАН</small></div><div class="plan"><span class="windows">О К Н А · В И Т Р И Н А</span><span class="bar">БАР</span><span class="entrance">ВХОД</span>${v.tables.map(t=>{const status=tableState(v.id,t.id);const dim=!admin&&t.seats<state.guests;return `<button class="table ${status} ${t.shape||''} ${state.selected===t.id?'selected':''} ${dim?'dim':''}" style="left:${t.x}%;top:${t.y}%" onclick="selectTable(${t.id})"><b>${String(t.id).padStart(2,'0')}</b><small>${t.seats} м.</small></button>`}).join('')}</div></div>`}
  function renderGuestDetail(){const t=venue().tables.find(x=>x.id===state.selected);if(!t)return `<aside class="detail"><div class="empty-detail"><span>02</span><h3>НАЖМИТЕ НА СТОЛ</h3><p>Зелёные столики доступны на выбранное время и подходят для вашей компании.</p></div></aside>`;const status=tableState(state.venueId,t.id);const unavailable=status!=='free'||t.seats<state.guests;return `<aside class="detail active"><button class="close-sheet" onclick="selectTable(null)">×</button><span class="badge ${status}">${status==='free'?'СВОБОДЕН':status==='occupied'?'ЗАНЯТ':status==='late'?'ОПАЗДЫВАЮТ':'ЕСТЬ БРОНЬ'}</span><h3>СТОЛ ${t.id}</h3><p class="muted">${esc(t.note)} · до ${t.seats} гостей</p><p class="slot">${fmt(state.start)}–${fmt(state.start+state.duration)}</p>${unavailable?`<p class="muted">${t.seats<state.guests?'Для вашей компании нужен стол побольше.':'На выбранный интервал стол недоступен. Выберите другой стол или время.'}</p>`:`<form class="form" onsubmit="submitBooking(event)"><label class="field"><span>Ваше имя</span><input name="name" required maxlength="60" placeholder="Например, Алексей"></label><label class="field"><span>Телефон</span><input name="phone" required maxlength="24" placeholder="+7 999 123-45-67"></label><label class="field"><span>Комментарий</span><textarea name="comment" maxlength="180" placeholder="Детский стул, день рождения…"></textarea></label><span class="form-note">Для проверки можно указать вымышленные данные.</span><button class="primary">Забронировать столик</button></form>`}</aside>`}
  function renderGuest(){const v=venue(),noSeats=freeCount()===0;const nearest=[1170,1200,1230,1260,1290,1320].find(t=>t>state.start&&venues.find(x=>x.id===state.venueId).tables.some(table=>table.seats>=state.guests&&!allBookings().some(b=>b.venueId===state.venueId&&b.tableId===table.id&&overlaps(b,t,t+state.duration))));return `${state.origin?`<button class="back" onclick="returnToAlternatives()">Вернуться к выбору ресторанов</button>`:''}<section class="venue-summary"><div><p class="eyebrow">ВЫБРАННЫЙ РЕСТОРАН</p><h2>${esc(v.name)}</h2></div><div class="venue-meta"><span>${esc(v.address)}</span><span>${v.hours}</span><span>${v.phone}</span></div></section>
    <section class="booking-panel"><div class="booking-head"><div><p class="eyebrow">ШАГ 1</p><h2>КОГДА ВЫ ПРИДЁТЕ?</h2></div><span class="date">Сегодня, ${today()}</span></div><div class="quick-times">${[1020,1080,1140,1200,1260].map(t=>`<button class="${state.start===t?'active':''}" onclick="setStart(${t})">${fmt(t)}</button>`).join('')}</div><div class="selectors"><label class="field"><span>Время</span><select onchange="setStart(this.value)">${Array.from({length:22},(_,i)=>660+i*30).map(t=>`<option value="${t}" ${state.start===t?'selected':''}>${fmt(t)}</option>`).join('')}</select></label><label class="field"><span>Длительность</span><select onchange="setDuration(this.value)">${[[60,'1 час'],[90,'1,5 часа'],[120,'2 часа']].map(([n,l])=>`<option value="${n}" ${state.duration===n?'selected':''}>${l}</option>`).join('')}</select></label><label class="field"><span>Гостей</span><select onchange="setGuests(this.value)">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${state.guests===n?'selected':''}>${n}</option>`).join('')}</select></label></div></section>
    ${noSeats?`<section class="full-card"><div class="full-copy"><span class="pill">НА ${fmt(state.start)} МЕСТ НЕТ</span><h2>НО МЫ НАШЛИ СТОЛИКИ РЯДОМ</h2><p>Время и количество гостей сохранятся. Выберите другой «Зерно» — сразу покажем его зал.</p>${nearest?`<button class="outline" onclick="setStart(${nearest})">Здесь свободно с ${fmt(nearest)}</button>`:''}</div><div class="alternatives">${venues.filter(x=>x.id!==state.venueId&&freeCount(x.id)>0).map(x=>`<button class="alt-card" onclick="setVenue('${x.id}',true)"><small>ЕСТЬ МЕСТА · ${freeCount(x.id)} ${tableWord(freeCount(x.id))}</small><strong>${esc(x.name)}</strong><span>${esc(x.address)}</span><i>Посмотреть зал</i></button>`).join('')}<button class="wait-link" onclick="openWaitlist()">Записаться в лист ожидания</button></div></section>`:''}
    <section class="map-section"><div class="section-head"><div><p class="eyebrow">ШАГ 2</p><h2>ВЫБЕРИТЕ СТОЛИК</h2></div><div class="legend"><span><i class="dot free"></i>Свободен</span><span><i class="dot reserved"></i>Бронь</span><span><i class="dot occupied"></i>Занят</span></div></div><div class="workspace">${renderHall(false)}${renderGuestDetail()}</div><p class="map-note">Планировки в демо условные. Перед запуском их заменят на реальные схемы помещений. Брони сохраняются только в этом браузере.</p></section>`}

  function currentVenueRows(){return allBookings().filter(b=>b.venueId===state.venueId&&b.status!=='waitlist').sort((a,b)=>a.start-b.start)}
  function renderAdminDetail(){const t=venue().tables.find(x=>x.id===state.selected);if(!t)return `<aside class="detail admin-detail"><div class="empty-detail"><span>01</span><h3>ВЫБЕРИТЕ СТОЛ</h3><p>Нажмите на столик на схеме, чтобы увидеть бронь и изменить её статус.</p></div></aside>`;const row=currentVenueRows().find(b=>b.tableId===t.id&&overlaps(b));const status=row?badgeClass(row.status):'free';return `<aside class="detail admin-detail active"><button class="close-sheet" onclick="selectTable(null)">×</button><span class="badge ${status}">${row?statusLabel(row.status).toUpperCase():'СВОБОДЕН'}</span><h3>СТОЛ ${t.id}</h3><p class="muted">${esc(t.note)}</p>${row?`<div class="admin-booking"><div><small>ВРЕМЯ</small><b>${fmt(row.start)}–${fmt(row.end)}</b></div><div><small>ГОСТЬ</small><b>${esc(row.name)}</b><span>${row.guests} чел. · ${esc(row.phone)}</span></div>${row.comment?`<p class="muted">${esc(row.comment)}</p>`:''}<small>ИЗМЕНИТЬ СТАТУС</small><div class="status-actions"><button class="ghost" onclick="changeStatus('${row.id}','confirmed')">Подтвердить</button><button class="ghost" onclick="changeStatus('${row.id}','late')">Опаздывают</button><button class="primary" onclick="changeStatus('${row.id}','seated')">Гости пришли</button><button class="outline" onclick="changeStatus('${row.id}','completed')">Освободить</button><button class="danger" onclick="changeStatus('${row.id}','cancelled')">Отменить бронь</button><button class="ghost" onclick="changeStatus('${row.id}','no_show')">Не пришли</button></div></div>`:`<div class="free-state"><span style="font-size:1.6rem">✓</span><b>Стол свободен</b><p>На текущий интервал активных броней нет.</p></div>`}</aside>`}
  function renderAdmin(){const v=venue(),rows=currentVenueRows(),waiting=allBookings().filter(b=>b.venueId===state.venueId&&b.status==='waitlist'),active=rows.filter(b=>activeStatuses.includes(b.status)),seated=rows.filter(b=>['occupied','seated'].includes(b.status));const load=Math.round((1-freeCount()/v.tables.length)*100);return `<section class="admin"><div class="admin-top"><div><p class="eyebrow">УПРАВЛЕНИЕ ЗАЛОМ</p><h2>${esc(v.name)}</h2><p>${esc(v.address)} · автономная демоверсия</p></div><button class="outline" onclick="resetDemo()">Сбросить демо</button></div><div class="venue-tabs">${venues.map(x=>`<button class="venue-tab ${x.id===state.venueId?'active':''}" onclick="setVenue('${x.id}')"><small>ЗЕРНО</small><strong>${esc(x.short)}</strong><span>${esc(x.address)}</span></button>`).join('')}</div><div class="stats"><article class="stat"><span>Активные брони</span><b>${active.length}</b></article><article class="stat"><span>Гости за столом</span><b>${seated.length}</b></article><article class="stat"><span>Лист ожидания</span><b>${waiting.length}</b></article><article class="stat"><span>Загрузка</span><b>${load}%</b></article></div><div class="toolbar"><div class="view-tabs"><button class="${state.view==='map'?'active':''}" onclick="state.view='map';render()">Схема зала</button><button class="${state.view==='list'?'active':''}" onclick="state.view='list';render()">Список броней</button></div><span>${rows.length} записей на сегодня</span></div>${state.view==='map'?`<div class="workspace">${renderHall(true)}${renderAdminDetail()}</div>`:`<div class="reservation-list">${rows.length?rows.map(r=>`<article class="reservation-row"><div class="time"><b>${fmt(r.start)}</b><span>${fmt(r.end)}</span></div><div class="guest"><b>${r.tableId?`Стол ${r.tableId}`:'Без стола'} · ${r.guests} гостя</b><span>${esc(r.name)} · ${esc(r.phone)}</span>${r.comment?`<small>${esc(r.comment)}</small>`:''}</div><span class="badge ${badgeClass(r.status)}">${statusLabel(r.status)}</span><button class="ghost" onclick="state.selected=${r.tableId};state.view='map';render()">На схеме</button></article>`).join(''):`<p class="empty">Броней пока нет.</p>`}</div>`}${waiting.length?`<div class="reservation-list" style="margin-top:1rem"><p class="empty"><b>ЛИСТ ОЖИДАНИЯ</b></p>${waiting.map(r=>`<article class="reservation-row"><div class="time"><b>${fmt(r.start)}</b></div><div class="guest"><b>${esc(r.name)} · ${r.guests} гостя</b><span>${esc(r.phone)}</span></div><span class="badge reserved">Ожидает</span><button class="ghost" onclick="changeStatus('${r.id}','confirmed')">Подтвердить</button></article>`).join('')}</div>`:''}</section>`}
  function render(){$('headerVenue').textContent=venue().short;$('guestMode').classList.toggle('active',state.mode==='guest');$('adminMode').classList.toggle('active',state.mode==='admin');$('app').innerHTML=state.mode==='guest'?renderGuest():renderAdmin()}
  render();
  </script>
</body>
</html>
